name: Public client native setup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-client-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed PR sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify reviewed public hashes and reject sensitive artifacts
        run: python3 tools/verify_public_tree.py
      - name: Verify Solar percentage pies and monitored energy ranking
        run: node tests/public-client/test_solar144.cjs custom_components/cloudpelizzon/ui/solar/energy-card.js
      - name: Verify Solar expiry, load empty states, board charts and insights
        run: |
          python3 tests/public-client/test_solar143.py custom_components/cloudpelizzon
          node tests/public-client/test_solar143.cjs custom_components/cloudpelizzon/ui/solar/energy-card.js
      - name: Verify Solar save readback and cleared warnings
        run: node tests/public-client/test_solar142.cjs custom_components/cloudpelizzon/ui/solar/panel.js
      - name: Verify Solar topology, history ownership and daily energy
        run: |
          node tests/public-client/test_solar141.cjs custom_components/cloudpelizzon
          python3 tests/public-client/test_solar_bindings141.py custom_components/cloudpelizzon
      - name: Verify Solar source mapping, microinverter, boards and bundled assets
        run: node tests/public-client/test_repair133.cjs custom_components/cloudpelizzon
      - name: Verify real daily counts and production Solar data routing
        run: node tests/public-client/test_source132.cjs custom_components/cloudpelizzon
      - name: Verify Solar refresh and visible detection feedback
        run: node tests/public-client/test_solar131.cjs custom_components/cloudpelizzon/ui/solar/panel.js
      - name: Verify browser export without network or devices
        run: node tests/public-client/test_export.cjs custom_components/cloudpelizzon/ui/automation/panel.js
      - name: Verify active trial navigation without browser reload
        run: node tests/public-client/test_navigation.cjs custom_components/cloudpelizzon/ui/shell/panel.js custom_components/cloudpelizzon/ui/core/panel.js
      - name: Verify explicit commercial requests and receipt validation
        run: node tests/public-client/test_commercial157.cjs custom_components/cloudpelizzon
      - name: Verify consented Fleet metadata lifecycle
        run: python3 tests/public-client/test_fleet_reporter.py custom_components/cloudpelizzon
      - name: Verify trial offers match available modules
        run: node tests/public-client/test_trial_availability.cjs custom_components/cloudpelizzon/ui/core/panel.js
      - name: Verify legacy tabs receive updated trial and portal actions
        run: node tests/public-client/test_legacy_compat.cjs custom_components/cloudpelizzon/ui/core/hacs-brand-compat.js
      - name: Verify maintenance savings, financial retry and XLSX export
        run: node tests/public-client/test_finance.cjs custom_components/cloudpelizzon/ui/maintenance/legacy-v311-core.js /tmp/maintenance-test.xlsx
      - name: Verify maintenance waits for server persistence
        run: node tests/public-client/test_order.cjs custom_components/cloudpelizzon/ui/maintenance/legacy-v311-core.js custom_components/cloudpelizzon/ui/maintenance/panel.js
      - name: Verify formatted Excel workbook and numeric round trip
        run: node tests/public-client/test_writer.cjs custom_components/cloudpelizzon/ui/maintenance/exceljs-4.4.0.min.js custom_components/cloudpelizzon/ui/maintenance/finance-excel111.js /tmp/report111.xlsx
      - name: Verify PDF and Excel share identical report content
        run: node tests/public-client/test_pdf_parity.cjs custom_components/cloudpelizzon/ui/maintenance/legacy-v311-core.js custom_components/cloudpelizzon/ui/maintenance/legacy-v311-core.js /tmp/report111.html /tmp/history111.html
      - name: Verify desktop Excel compatibility without changing values or print settings
        run: node tests/public-client/test_xlsx_compat.cjs custom_components/cloudpelizzon/ui/maintenance/exceljs-4.4.0.min.js custom_components/cloudpelizzon/ui/maintenance/fflate-0.8.3.min.js custom_components/cloudpelizzon/ui/maintenance/finance-excel111.js /tmp/report117.xlsx
      - name: Verify Solar provider escaping and live energy direction
        run: node tests/public-client/test_solar145.cjs custom_components/cloudpelizzon/ui/solar/energy-card.js custom_components/cloudpelizzon/ui/solar/panel.js
      - name: Verify Solar exact display scale and measured flow anchors
        run: node tests/public-client/test_solar146.cjs custom_components/cloudpelizzon/ui/solar/energy-card.js custom_components/cloudpelizzon/ui/solar/panel.js
      - name: Verify disabled automation categories and shield boundary
        run: node tests/public-client/test_modules147.cjs custom_components/cloudpelizzon
      - name: Verify automation inventory does not wait for history
        run: node tests/public-client/test_automation148.cjs custom_components/cloudpelizzon
      - name: Verify category order and save button feedback
        run: node tests/public-client/test_automation149.cjs custom_components/cloudpelizzon
      - name: Verify CSV is removed and Excel inventory stays formatted
        run: node tests/public-client/test_automation151.cjs custom_components/cloudpelizzon
      - name: Verify per-view reference density and touch scale
        run: node tests/public-client/test_display150.cjs custom_components/cloudpelizzon
      - name: Validate the candidate integration with official hassfest
        run: docker run --rm -v "$PWD/.:/github/workspace:ro" ghcr.io/home-assistant/hassfest
      - name: Pull pinned Home Assistant runtime
        run: docker pull ghcr.io/home-assistant/home-assistant@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
      - name: Test native flow manager and private local identity storage
        run: |
          docker run --rm --entrypoint python --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --memory 1024m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912,mode=1777 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/.:/candidate:ro" \
            -v "$PWD/tests/public-client:/checks:ro" \
            ghcr.io/home-assistant/home-assistant@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0 \
            -B /checks/run.py





