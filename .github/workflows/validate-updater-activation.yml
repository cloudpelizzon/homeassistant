name: Validate CloudPelizzon updater activation UX

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  updater-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check custom_components/cloudpelizzon/updater/frontend/panel.js
          node --check custom_components/cloudpelizzon/core/frontend/panel.js
          node --check custom_components/cloudpelizzon/frontend/optional-modules.js
          node --input-type=module --check < custom_components/cloudpelizzon/frontend/panel.js

      - name: Check licensing guard syntax and revocation
        run: |
          python3 -m py_compile \
            custom_components/cloudpelizzon/core/license.py \
            custom_components/cloudpelizzon/core/commercial_guard.py \
            custom_components/cloudpelizzon/core/api.py \
            custom_components/cloudpelizzon/runtime_service.py
          python3 -m py_compile custom_components/cloudpelizzon/core/security_contract.py
          python3 -m py_compile custom_components/cloudpelizzon/core/reactivation.py
          python3 tests/test_commercial_guard.py
          python3 tests/test_security_revocation_contract.py
          python3 tests/test_license_reactivation_resume.py
          python3 tests/test_license_revocation_sticky.py
          python3 tests/test_updater_license_visibility.py

      - name: Smoke test activation and navigation
        shell: bash
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          const optionalSrc = fs.readFileSync(
            'custom_components/cloudpelizzon/frontend/optional-modules.js', 'utf8'
          );
          const unifiedSrc = fs.readFileSync(
            'custom_components/cloudpelizzon/frontend/panel.js', 'utf8'
          );
          assert.match(optionalSrc, /class CloudPelizzonModuleSlot/);
          assert.match(optionalSrc, /cp_retry=/);
          assert.match(optionalSrc, /Tentar carregar novamente/);
          assert.equal(optionalSrc.includes("customElements.define(tag"), false);
          assert.doesNotMatch(optionalSrc, /Este módulo não está instalado neste equipamento/);
          for (const sku of ['CP-MAINTENANCE','CP-ENERGY','CP-SECURITY']) {
            assert.match(unifiedSrc, new RegExp('cloudpelizzon-module-slot sku="'+sku+'"'));
          }
          assert.equal(unifiedSrc.includes("slot.activate()"), true);

          const updaterSrc = fs.readFileSync(
            'custom_components/cloudpelizzon/updater/frontend/panel.js', 'utf8'
          );
          const coreSrc = fs.readFileSync(
            'custom_components/cloudpelizzon/core/frontend/panel.js', 'utf8'
          );

          const classes = new Map();
          let destination = null;
          const context = {
            HTMLElement: class {},
            customElements: {
              define: (name, ctor) => classes.set(name, ctor),
              get: name => classes.get(name),
              whenDefined: async name => classes.get(name),
            },
            document: { querySelectorAll: () => [] },
            window: {
              addEventListener: () => {},
              location: { assign: url => { destination = url; } },
            },
            requestAnimationFrame: () => {},
            queueMicrotask: () => {},
            console,
          };
          vm.runInNewContext(updaterSrc, context, { timeout: 2500 });
          const Updater = classes.get('cloudpelizzon-updater-panel');
          assert.ok(Updater, 'Updater panel is registered');
          const panel = new Updater();
          const handlers = {};
          panel.querySelector = selector => ({
            addEventListener: (type, fn) => { handlers[selector] = fn; },
            set onclick(fn) { handlers[selector] = fn; }
          });

          panel.renderError('online_activation_required');
          assert.match(panel.innerHTML, /Ativa[cç][aã]o necess[aá]ria/i);
          assert.match(panel.innerHTML, /Gerenciar licen[cç]a/);
          assert.match(panel.innerHTML, /href="\/hacs"/);
          assert.doesNotMatch(panel.innerHTML, /activation_secret|CP1\.\.\./);
          assert.equal(typeof handlers['#open-license'], 'function');
          handlers['#open-license']();
          assert.equal(destination, '/cloudpelizzon?cp_open_license=1');

          panel.data = {
            channel: 'stable',
            components: [{ sku: 'CP-CORE', name: 'Core', version: '6.2.10' }],
            releases: [{
              sku: 'CP-MAINTENANCE', title: 'Manutenção', release_id: 'signed-release-test',
              version: '1.6.1', update_available: true, channel: 'stable'
            }],
            backups: [],
            documentation: [],
            history: [],
          };
          panel.querySelectorAll = () => [];
          panel.render();
          assert.match(panel.innerHTML, /CP-MAINTENANCE/);
          assert.match(panel.innerHTML, /Instalar módulo/);
          assert.match(panel.innerHTML, /data-install="signed-release-test"/);
          assert.doesNotMatch(panel.innerHTML, /Não instalado.*Atualizado/s);

          panel.renderError('installation_id_missing');
          assert.match(panel.innerHTML, /Identifica[cç][aã]o da instala[cç][aã]o necess[aá]ria/);

          panel.renderError('temporarily_unavailable');
          assert.match(panel.innerHTML, /Tentar novamente/);
          assert.doesNotMatch(panel.innerHTML, /id="open-license"/);

          assert.match(coreSrc, /openLicenseFromUrl\(\)/);
          assert.match(coreSrc, /cp_open_license/);
          assert.match(coreSrc, /MÓDULOS OPERACIONAIS/);
          assert.match(coreSrc, /Em desenvolvimento/);
          assert.match(coreSrc, /Licenciado • instalação pendente/);
          assert.match(coreSrc, /data-updates/);
          assert.match(coreSrc, /cloudpelizzon-updates/);

          assert.match(coreSrc, /this\.showLicense\(\)/);

          const managerSrc = fs.readFileSync(
            'custom_components/cloudpelizzon/updater/manager.py', 'utf8'
          );
          assert.match(managerSrc, /online_activation_required/);
          assert.match(managerSrc, /activation_secret/);
          console.log('PASS: activation CTA, HACS link, generic error, unchanged licensing guard');
          JS

      - name: Validate unified 17-SKU public metadata (no commercial code)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import types

          base = Path('custom_components/cloudpelizzon')
          package = types.ModuleType('cloudpelizzon')
          package.__path__ = [str(base)]
          sys.modules['cloudpelizzon'] = package

          from cloudpelizzon.module_catalog import MODULES
          from cloudpelizzon.registry import COMPONENTS

          licensed = set(MODULES)
          distributed = set(COMPONENTS) - {'CP-CORE', 'CP-UPDATER'}
          assert len(licensed) == 17, len(licensed)
          developed = {sku for sku, meta in MODULES.items() if meta.get('lifecycle') == 'developed'}
          planned = {sku for sku, meta in MODULES.items() if meta.get('lifecycle') == 'planned'}
          assert developed == {'CP-MAINTENANCE', 'CP-ENERGY', 'CP-SECURITY'}, developed
          assert len(planned) == 14 and not (planned & developed), planned

          assert licensed == distributed, (licensed ^ distributed)

          for sku in licensed:
              path = COMPONENTS[sku]['path']
              assert path.startswith('modules/'), (sku, path)
              assert not (base / path).exists(), f'Commercial module leaked to HACS: {sku}'

          core_const = (base / 'core' / 'const.py').read_text(encoding='utf-8')
          assert 'from ..module_catalog import MODULES' in core_const
          manager = (base / 'updater' / 'manager.py').read_text(encoding='utf-8')
          for guard in ('HACS_BOOTSTRAP_RELEASE_FILTER',
                        'HACS_BOOTSTRAP_OWNERSHIP_GATE',
                        'HACS_BOOTSTRAP_ROLLBACK_GATE'):
              assert guard in manager, guard
          assert 'release_downgrade_not_allowed' in manager
          assert '_version_key(release["version"]) < _version_key(current)' in manager
          print('PASS: 17 SKUs match; commercial source absent; updater gates retained')
          PY
